version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-linkiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - linkiq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkiq}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - linkiq-network

  redis:
    image: redis:7-alpine
    container_name: linkiq-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - linkiq_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - linkiq-network

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: linkiq-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - apps/api/.env
    ports:
      - "${API_PORT:-4000}:4000"
    networks:
      - linkiq-network

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: linkiq-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - apps/web/.env
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - linkiq-network

networks:
  linkiq-network:
    driver: bridge

volumes:
  linkiq_postgres_data:
  linkiq_redis_data:
