<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline · LinkIQ</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #1c1917;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0f1a;
          color: #f8fafc;
        }
      }
      .card {
        max-width: 360px;
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #78716c;
        margin: 0 0 20px;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        background: #f97316;
        color: #1c1917;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #f97316;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg
        class="mark"
        viewBox="0 0 32 32"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <rect width="32" height="32" rx="7" fill="currentColor" opacity="0.06" />
        <rect x="5" y="5" width="14" height="14" rx="5" stroke="currentColor" stroke-width="3.5" />
        <rect x="13" y="13" width="14" height="14" rx="5" fill="#F97316" />
      </svg>
      <h1>You appear to be offline</h1>
      <p>Reconnect to continue. LinkIQ needs a live connection for your links, analytics, and account data.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
