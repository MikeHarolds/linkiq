# LinkIQ — Nginx reverse proxy (production)
#
# Terminates TLS and routes:
#   /api/*  -> api container (port 4000)
#   /*      -> web container (port 3000)
#
# Copy to /etc/nginx/sites-available/linkiq.conf and symlink into
# sites-enabled, then run certbot for TLS. See
# docs/deployment/production-deployment.md for the full walkthrough.

upstream linkiq_web {
    server 127.0.0.1:3000;
}

upstream linkiq_api {
    server 127.0.0.1:4000;
}

server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://linkiq_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://linkiq_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
