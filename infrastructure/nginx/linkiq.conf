# LinkIQ — Nginx reverse proxy (production)
#
# Terminates TLS and routes:
#   /api/*                          -> api container (port 4000)
#   /<shortCode> (LinkIQ short link) -> api container (port 4000), direct
#   /*                              -> web container (port 3000)
#
# The short-link rule exists so redirects — the single highest-QPS path
# in the system (see redirect.service.ts) — never take an extra hop
# through the Next.js server process just to be proxied again. It's not
# load-bearing for correctness: apps/web/next.config.js has its own
# rewrite for the exact same short-code shape, so a request that reaches
# the web process anyway (local dev without nginx, or if this rule is
# ever removed) still redirects correctly, just with one extra hop.
#
# Copy to /etc/nginx/sites-available/linkiq.conf and symlink into
# sites-enabled, then run certbot for TLS. See
# docs/deployment/production-deployment.md for the full walkthrough.

upstream linkiq_web {
    server 127.0.0.1:3000;
}

upstream linkiq_api {
    server 127.0.0.1:4000;
}

server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://linkiq_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LinkIQ short-link redirects, matched straight to the API — same
    # shape as apps/web/next.config.js's rewrite (auto-generated codes:
    # 7 base62 chars; custom slugs: 3-50 chars of [A-Za-z0-9_-] — see
    # apps/api/src/common/utils/short-code.ts). A regex location always
    # takes priority over the plain-prefix `location /` below, regardless
    # of file order, so this never competes with real app routes there.
    location ~ ^/[A-Za-z0-9_-]{3,50}$ {
        proxy_pass http://linkiq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://linkiq_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
