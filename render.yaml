# LinkIQ — Render Blueprint (Sprint 19)
#
# Deploys the SAME application source code as local Windows/Codespaces —
# only infrastructure wiring differs, exactly per Sprint 19's
# architectural rule. Nothing here is deployed automatically; this file
# only prepares the repository so `render blueprint launch` (or the
# Render dashboard's "New Blueprint Instance") can create these
# services when you're ready. See docs/deployment/render.md for the
# full walkthrough, including which env vars need real values filled in
# manually after the Blueprint is created.
#
# Architecture: two Render Web Services (API, Web) + one managed
# PostgreSQL + one managed Key Value (Redis-compatible) instance —
# matching the "Render Web Service / Render API Service / Render
# PostgreSQL / Redis-compatible service" shape from the Sprint 19 spec.
# Commands run from the repo root (this is an npm-workspaces monorepo —
# `npm ci` must see the root lockfile), using the exact same root-level
# scripts documented in the README (build:api/start:api, build:web
# via `--workspace=apps/web`/start:web) — no Render-specific commands.
#
# `free` plan on every resource — deliberate for an investor-demo
# deployment: no billing-account requirement, and this repo does not
# need real production-tier compute to demonstrate the product. Known
# free-tier tradeoffs, both reversible by editing this file and
# redeploying once a paid plan is wanted: free Postgres instances
# expire after 90 days of inactivity (Render emails a warning first);
# free web services spin down after ~15 minutes idle and take a few
# seconds to wake on the next request — acceptable for a demo, not for
# a real production SLA.

databases:
  - name: linkiq-postgres
    plan: free
    databaseName: linkiq
    user: linkiq

services:
  - type: keyvalue
    name: linkiq-redis
    plan: free
    ipAllowList: [] # private network only — no public internet access
    maxmemoryPolicy: noeviction

  - type: web
    name: linkiq-api
    runtime: node
    plan: free
    # --include=dev is required here: NODE_ENV=production (set below,
    # needed by the running app) also reaches the build step on Render,
    # which makes plain `npm ci` skip devDependencies - silently
    # breaking this build since `nest build` itself (@nestjs/cli) is a
    # devDependency. Live-discovered via a real Render build failure
    # ("sh: 1: nest: not found") after the same NODE_ENV had already
    # broken the husky prepare script the same way.
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build:api
    # `prisma migrate deploy` (non-destructive, applies only PENDING
    # migrations, NEVER `migrate reset`) runs immediately before the
    # app boots. `preDeployCommand` (a dedicated pre-deploy phase) is
    # the preferred mechanism but is not available on the free plan —
    # discovered via `render blueprints validate` against this actual
    # account ("pre-deploy command is not supported for free tier
    # services"). Folding it into startCommand is the standard fallback
    # for tiers without that hook: still idempotent, still applied
    # before `node dist/main` starts serving traffic, still never
    # destructive — see docs/architecture/paystack-integration.md for
    # why this project never auto-resets a database. Upgrading the
    # `linkiq-api` service off the free plan later can restore the
    # separate preDeployCommand step if wanted.
    startCommand: npm run db:deploy && npm run start:api
    healthCheckPath: /api/v1/health
    buildFilter:
      paths:
        - apps/api/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: linkiq-postgres
          property: connectionString
      # The keyvalue service's exact connection properties depend on
      # your Render account/region at blueprint-creation time — fill
      # these in from the Render dashboard once linkiq-redis exists
      # (see docs/deployment/render.md's Redis section). Never guess a
      # value here; an unreachable Redis must fail loudly (Sprint 19
      # §8), not silently disable queues.
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      # Set to this API service's own Render URL after first deploy
      # (Render assigns it, so it isn't knowable before creation) —
      # used to build absolute uploaded-file URLs (see branding.config.ts).
      - key: API_PUBLIC_URL
        sync: false
      # Set to the linkiq-web service's Render URL — used to build
      # short-link/QR-code URLs and the Paystack checkout callback.
      - key: APP_URL
        sync: false
      # Same value as APP_URL above — the allowed browser origin.
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: VISITOR_HASH_SALT
        generateValue: true
      # Paystack LIVE credentials for a real production deployment, or
      # TEST credentials for a Render staging/demo environment — never
      # committed, always filled in manually. Live/test mode is
      # inferred automatically from this key's own sk_test_/sk_live_
      # prefix (see paystack.config.ts) — no separate mode flag exists
      # to get out of sync with it.
      - key: BILLING_PROVIDER
        value: paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

  - type: web
    name: linkiq-web
    runtime: node
    plan: free
    # See linkiq-api's buildCommand comment above - same NODE_ENV vs.
    # devDependencies issue applies here (Next.js's own build tooling).
    buildCommand: npm ci --include=dev && npm run build --workspace=apps/web
    startCommand: npm run start:web
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_ENV
        value: production
      # This API service's own Render URL + /api/v1 — fill in after
      # linkiq-api's URL is known (same value used for API_PUBLIC_URL
      # above, plus the path prefix).
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_REFRESH_COOKIE_NAME
        value: linkiq_refresh_token
      - key: API_ORIGIN
        sync: false
